aid: rapchat
name: Rapchat
description: >-
  Rapchat is a mobile-first music creation platform for artists, rappers,
  singers, and producers, founded in 2014. Creators use the Rapchat iOS and
  Android apps to find professionally-produced beats from top producers, record
  studio-quality vocals with effects and audio filters, write lyrics, join
  music challenges, collaborate, and share finished songs with a creator
  community. The platform reports 15M+ creators, 100M+ tracks, and over one
  billion plays, and offers free web-based artist tools (rap name generator,
  lyric generator, rhyme finder, BPM mood guide) alongside Free, Premium, and
  Pro subscription tiers. Rapchat is a portfolio company of 500 Global. As of
  this profile the company exposes no public developer API, SDK, or developer
  portal; its /api endpoint is an internal application backend (HTTP 403).
